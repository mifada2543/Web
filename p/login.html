<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
    form {
        margin: 100px auto;
        width: 300px;
        padding: 30px;
        border: 1px solid #D9D9D9;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        background-color: #f9f9f9;
    }
    .space {
        justify-content: space-between;
        display: flex;
    }
    h1 {
        text-align: center;
        margin-top: 100px;
    }
    .button {
        width: 80px;
        color: white;
        background-color: rgb(0, 0, 0, 0.3);
    }
</style>
<body>
    <h1>Login</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        <div class="space">
            <button class="button" type="button" onclick="window.location.href = 'Home.html'">Login</button>
            <button class="button" type="button" onclick="window.location.href = 'Register.html'">Register</button>
        </div>
    </form>
</body>
</html>
