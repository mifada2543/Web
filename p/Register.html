<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<style>
    form {
        margin: 50px auto;
        width: 300px;
        padding: 30px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
        background-color: rgba(255, 255, 255, 0.302);
        text-align: center;
    }

    .space {
        justify-content: space-between;
        display: flex;
    }

    h1 {
        text-align: center;
        margin-top: 100px;
    }

    .button {
        width: 80px;
        color: white;
        background-color: rgb(0, 0, 0, 0.3);
    }
    .role {
        width: 150px;
        color: white;
        background-color: rgb(0, 0, 0, 0.3);
    }
</style>

<body>
    <h1>Register</h1>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="Pria" name="gender" value="Pria"><label for="pria">Pria</label>
        <input type="radio" id="Wanita" name="gender" value="Wanita"><label for="wanita">Wanita</label>
        <br><br>
        <label for="Date">Date:</label>
        <input type="date" id="tgl-lhr" name="tgl-lhr">
        <br><br>
        <label for="Address">Address:</label>
        <br>
        <textarea name="Address" id="Address" rows="5" cols="30">Alamat anda</textarea>
        <br><br>
        <label for="pekerjaan">pekerjaan sebelumnya?</label>
        <select class="role" name="pekerjaan" id="pekerjaan">
            <option value="Backend">Backend Developer</option>
            <option value="Frontend">Frontend Developer</option>
            <option value="Fullstack">Fullstack Developer</option>
            <option value="Data Analyst">Data Analyst</option>
            <option value="Data Scientist">Data Scientist</option>
        </select>
        <br><br>
        <div class="space">
            <button class="button" type="button" onclick="window.location.href = 'login.html'">Back</button>
            <button class="button" type="button" onclick="window.location.href = 'Home.html'">Register</button>
        </div>
    </form>
</body>

</html>
